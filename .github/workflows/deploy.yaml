---
name: Deploy

on:
  push:
    branches:
    - '**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DART_SASS_VERSION: 1.108.2
  HUGO_VERSION: 0.170.1
  NODE_VERSION: '24'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Hugo reads the commit history for --enableGitInfo.
        fetch-depth: 0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        cache: npm
        node-version: ${{ env.NODE_VERSION }}
    - uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
      with:
        extended: true
        hugo-version: ${{ env.HUGO_VERSION }}
    - name: Install Dart Sass
      run: |
        curl -fsSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
          | tar -xz -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
    - name: Install
      run: npm ci
    - name: Build
      run: npm run build
    - name: Deploy to production
      if: github.ref == 'refs/heads/main'
      run: npx wrangler deploy --message "${GITHUB_SHA::7}"
    - name: Upload preview
      # Dependabot runs cannot read repository secrets, so they only build.
      if: github.ref != 'refs/heads/main' && github.actor != 'dependabot[bot]'
      env:
        BRANCH: ${{ github.ref_name }}
      shell: bash
      run: |
        alias=$(printf '%s' "$BRANCH" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9' '-' | tr -s '-')
        alias=${alias#-}
        [[ $alias =~ ^[a-z] ]] || alias="b-$alias"
        alias=${alias:0:30}
        alias=${alias%-}
        npx wrangler versions upload --preview-alias "$alias" \
          --message "$BRANCH ${GITHUB_SHA::7}" | tee upload.log
        url=$(grep -oE "https://$alias-[^ ]+\.workers\.dev" upload.log | tail -1 || true)
        echo "Preview: ${url:-see the log above}" >> "$GITHUB_STEP_SUMMARY"
