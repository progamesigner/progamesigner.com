name: Site

on:
  push:
    paths:
      - site/**
      - .github/workflows/site.yml
  pull_request:
    paths:
      - site/**
      - .github/workflows/site.yml

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/dist
